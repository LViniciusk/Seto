name: tests

on:
  push:
  pull_request:

# Least privilege: the workflow only needs to read the repository.
permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      # Unit tests are self-contained: synthetic fixtures only, no ISO, no
      # commercial PRX, no proprietary compiler.  Integration tests auto-skip
      # because private/ media is absent.
      - name: Unit tests
        run: python -m pytest -q

      - name: Byte-compile
        run: python -m compileall -q src scripts tests
